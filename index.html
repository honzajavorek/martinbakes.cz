<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale = 1.0,maximum-scale = 1.0">
    <style>
      html, body {
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100vh;
        background-color: #000;
      }

      body {
        background-image: url('./bgv.webp');
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
      }

      @media only screen and (min-width: 810px) {
        body {
          background-image: url('./bgh.webp');
          background-size: contain;
        }
      }

      .overlay {
        width: 100%;
        height: 100%;
        background: linear-gradient(0deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      .quote {
        box-sizing: border-box;
        font-size: 5vh;
        font-family: sans-serif;
        color: #fff;
        text-align: center;
        padding: 1vh;
      }

      .author {
        text-align: right;
        font-size: 3vh;
        margin-top: 2vh;
      }

      .link {
        padding: 2vh;
        margin-top: 4vh;
      }

      .link a {
        font-size: 4vh;
        font-family: sans-serif;
        color: #fff;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="overlay">
      <div class="quote">
        „Mládí je&nbsp;nejen v&nbsp;letech, nýbrž i&nbsp;v&nbsp;myšlenkách.“
        <div class="author">&mdash; Francis Bacon</div>
      </div>
      <div class="link">
        <a href="https://oracle.zoom.us/my/michal.s.svec?pwd=cGJwdDd5RE9jY2VOSU5tbXVyckRyZz09">Rozbalit dárek</a>
      </div>
    </div>
  </body>
</html>
